name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: d177b119e9c56c9ddc0b7379ffce52341ec06584
          path: .ci/hermes-agent
      - run: python -m pip install -e .ci/hermes-agent
      - run: python -m py_compile __init__.py tests/verify_dual_module_regression.py
      - run: python tests/verify_dual_module_regression.py --plugin-source __init__.py
      - run: python tests/verify_dual_module_regression.py --plugin-source __init__.py --seed-legacy-v1-wrapper
      - run: hermes plugins validate . --json
      - run: hermes plugins doctor . --ci
